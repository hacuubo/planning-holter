# =============================================================================
#  Sauvegarde quotidienne du planning Holter
# =============================================================================
#  Cette tâche s'exécute automatiquement tous les matins, gratuitement, sur les
#  serveurs de GitHub. Elle n'a besoin d'aucun ordinateur allumé au cabinet.
#
#  Elle produit le classeur Excel de sauvegarde et le PDF des rendez-vous du
#  lendemain, les dépose dans l'espace de stockage Supabase, supprime les
#  sauvegardes de plus de 7 jours et envoie le tout par e-mail.
#
#  Tant que Supabase n'est pas installé, la tâche s'arrête d'elle-même dès la
#  première étape, sans erreur et sans e-mail d'alerte : il n'y a donc rien à
#  désactiver. Elle se met en marche toute seule le jour où vous enregistrez
#  les identifiants.
#
#  Les identifiants sont rangés dans : Settings ▸ Secrets and variables ▸ Actions
#  (voir docs/03-SAUVEGARDES.md).
# =============================================================================

name: Sauvegarde quotidienne

on:
  schedule:
    # 05:15 UTC = 07:15 en heure d'été française, 06:15 en heure d'hiver.
    # Le planning du lendemain est donc prêt avant l'ouverture du cabinet.
    - cron: '15 5 * * *'
  workflow_dispatch:        # permet aussi de la lancer à la main

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Paris        # indispensable : le logiciel raisonne en heure du cabinet

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Garde-fou : avant la mise en service, aucun identifiant Supabase n'est
      # encore enregistré. Plutôt que d'échouer tous les matins et de vous
      # envoyer un e-mail d'erreur, la tâche s'interrompt proprement ici.
      - name: Vérifier que Supabase est configuré
        id: configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sauvegarde ignorée::Supabase n'est pas encore configuré (secrets SUPABASE_URL et SUPABASE_SERVICE_KEY absents). Voir docs/03-SAUVEGARDES.md. Rien d'anormal avant la mise en service."
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Node.js
        if: steps.configuration.outputs.pret == 'oui'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer l'outil d'envoi d'e-mail
        if: steps.configuration.outputs.pret == 'oui'
        run: npm install --no-save --no-audit --no-fund nodemailer@6

      - name: Vérifier les règles métier avant de sauvegarder
        if: steps.configuration.outputs.pret == 'oui'
        run: node --test "tests/*.test.mjs"

      - name: Produire et envoyer la sauvegarde
        if: steps.configuration.outputs.pret == 'oui'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        run: node scripts/sauvegarde-quotidienne.mjs

      # Les fichiers ne sont JAMAIS enregistrés dans le dépôt GitHub :
      # ils contiennent des données de patients.
      - name: Effacer les fichiers produits
        if: always()
        run: rm -rf sauvegardes
